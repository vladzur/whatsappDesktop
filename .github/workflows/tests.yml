name: Tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-gi gir1.2-gtk-4.0 gir1.2-glib-2.0
          # WebKit package name varies across Ubuntu versions
          sudo apt-get install -y -qq gir1.2-webkit2-6.0 || \
          sudo apt-get install -y -qq gir1.2-webkit-6.0

      - name: Install test dependencies
        run: pip install pytest

      - name: Run tests with pytest
        run: PYTHONPATH="$PWD" python -m pytest tests/ -v
