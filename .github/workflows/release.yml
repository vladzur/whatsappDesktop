name: Build and Deploy

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Job 1: Bundle .flatpak adjunto al release ──
  bundle:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Extract version from tag
        run: |
          # Para release trigger: github.ref_name = "v1.0.8"
          # Para workflow_dispatch: github.ref_name = branch name
          REF="${{ github.ref_name }}"
          if [[ "$REF" =~ ^v[0-9] ]]; then
            VERSION="${REF#v}"
          else
            # Fallback: usar el último tag del repo
            VERSION="$(git describe --tags --abbrev=0 | sed 's/^v//')"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "==> Versión detectada: $VERSION"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder python3 python3-pip

      - name: Add Flathub remote
        run: flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Install GNOME 49 runtime and SDK
        run: |
          flatpak install --user -y flathub org.gnome.Platform/x86_64/49 org.gnome.Sdk/x86_64/49

      - name: Build Flatpak
        run: |
          sed -i "s/@VERSION@/${VERSION}/" com.vladzur.WhatsAppDesk.metainfo.xml
          jq --arg version "${VERSION}" \
            '.modules[0]."build-options".env.WHATSAPP_DESK_VERSION = $version' \
            build-aux/com.vladzur.WhatsAppDesk.json > build-aux/.ci-manifest.json
          flatpak-builder --force-clean --user --install-deps-from=flathub \
            --disable-rofiles-fuse \
            .flatpak-build \
            build-aux/.ci-manifest.json
          rm build-aux/.ci-manifest.json

      - name: Export to local repo
        run: |
          flatpak build-export \
            ~/.local/share/flatpak/repo \
            .flatpak-build \
            stable

      - name: Create Flatpak bundle
        run: |
          flatpak build-bundle \
            ~/.local/share/flatpak/repo \
            whatsapp-desk.flatpak \
            com.vladzur.WhatsAppDesk \
            stable

      - name: Upload Flatpak bundle to release
        uses: softprops/action-gh-release@v2
        with:
          files: whatsapp-desk.flatpak
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Job 2: Repositorio Flatpak desplegado en GitHub Pages ──
  repo:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Extract version from tag
        run: |
          REF="${{ github.ref_name }}"
          if [[ "$REF" =~ ^v[0-9] ]]; then
            VERSION="${REF#v}"
          else
            VERSION="$(git describe --tags --abbrev=0 | sed 's/^v//')"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "==> Versión detectada: $VERSION"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder python3 python3-pip

      - name: Add Flathub remote
        run: flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Install GNOME 49 runtime and SDK
        run: |
          flatpak install --user -y flathub org.gnome.Platform/x86_64/49 org.gnome.Sdk/x86_64/49

      - name: Build Flatpak into OSTree repo
        run: |
          sed -i "s/@VERSION@/${VERSION}/" com.vladzur.WhatsAppDesk.metainfo.xml
          jq --arg version "${VERSION}" \
            '.modules[0]."build-options".env.WHATSAPP_DESK_VERSION = $version' \
            build-aux/com.vladzur.WhatsAppDesk.json > build-aux/.ci-manifest.json
          flatpak-builder --force-clean --user --install-deps-from=flathub \
            --disable-rofiles-fuse \
            --default-branch="stable" \
            --repo=ostree \
            .flatpak-build \
            build-aux/.ci-manifest.json
          rm build-aux/.ci-manifest.json

      - name: Update OSTree summary
        run: |
          flatpak build-update-repo --prune ostree/

      - name: Generate index.flatpakrepo
        run: |
          cat > ostree/index.flatpakrepo << EOF
          [Flatpak Repo]
          Title=WhatsApp Desk
          Url=https://vladzur.github.io/whatsappDesktop/
          Homepage=https://github.com/vladzur/whatsappDesktop
          Comment=Unofficial WhatsApp desktop client packaged as a Flatpak
          Description=WhatsApp Web wrapped in a native GTK 4 desktop app with tray icon, notifications, and dark mode support.
          Icon=https://vladzur.github.io/whatsappDesktop/whatsapp-desk.svg
          DefaultBranch=stable
          EOF

      - name: Copy icon to repo root
        run: cp whatsapp-desk.svg ostree/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ostree/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
